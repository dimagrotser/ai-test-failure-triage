[project]
name = "failtriage"
version = "1.0.2"
description = "Groups and classifies CI test failures and reports them on the pull request"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "anthropic==1.11.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "typer==0.27.2",
]

[project.scripts]
failtriage = "failtriage.cli:app"

[dependency-groups]
dev = [
    "mutmut==3.8.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build==0.12.22"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wallet"]

[tool.mypy]
strict = true
mypy_path = "src:evals/lab/wallet"
explicit_package_bases = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
